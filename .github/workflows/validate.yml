name: validate

# Index health. The URL check reaches out to whatever hosts the catalogue
# points at, so a failure here can mean someone else's server is down rather
# than a mistake in this pull request. Code correctness lives in test.yml.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Schema, required fields, https-only urls, platform/extension match,
      # duplicate detection and the size guard.
      - name: Validate the index
        run: python3 index/validate.py index/index.json

      # Self-hosted entries cannot be checked offline: fetch every URL and
      # confirm it serves the promised bytes without redirecting.
      - name: Fetch every catalogue URL
        run: python3 index/check_urls.py index/index.json
