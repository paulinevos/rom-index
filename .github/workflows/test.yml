name: test

# Offline and deterministic: a red mark here means the code broke, never that
# someone's ROM host is down. The network checks live in validate.yml.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v
