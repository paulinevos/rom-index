name: release

# Publishing a GitHub release is the trigger: its tag names the version.
# The workflow writes that version into MANIFEST.JSON, attaches the built
# .mpk to the release, and publishes it to BadgeHub.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A release that ships a broken index is worse than no release.
      - name: Validate
        run: |
          python3 index/validate.py index/index.json
          python3 -m unittest discover -s tests

      # Tags have been cut both as "v0.2.4" and "0.2.5", so accept either.
      - name: Take the version from the tag
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          python3 bump_version.py --set "$VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "mpk=com.paulinevos.rom_installer_${VERSION}.mpk" >> "$GITHUB_OUTPUT"

      - name: Build the .mpk
        run: bash bundle.sh

      # The archive must hold exactly one top-level directory named after
      # fullname, or MicroPythonOS rejects it on install.
      - name: Check the archive layout
        run: |
          MPK="${{ steps.version.outputs.mpk }}"
          test -f "$MPK"
          TOP=$(unzip -Z1 "$MPK" | cut -d/ -f1 | sort -u)
          test "$TOP" = "com.paulinevos.rom_installer"

      # Nothing to commit when the manifest already matches the tag, which is
      # the case when the version was raised before cutting the release.
      - name: Record the version on the default branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add com.paulinevos.rom_installer/MANIFEST.JSON
          if git diff --cached --quiet; then
            echo "MANIFEST.JSON is already at ${{ steps.version.outputs.version }}"
            exit 0
          fi
          git commit -m "Set version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Attach the .mpk to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.version.outputs.mpk }}" --clobber

      # Skipped rather than failed when no token is configured, so the GitHub
      # release still gets its asset if BadgeHub is not set up.
      - name: Publish to BadgeHub
        env:
          BADGEHUB_API_TOKEN: ${{ secrets.BADGEHUB_API_TOKEN }}
        run: |
          if [ -z "$BADGEHUB_API_TOKEN" ]; then
            echo "::warning::BADGEHUB_API_TOKEN is not set; skipping BadgeHub"
            exit 0
          fi
          python3 publish_badgehub.py \
            --mpk "${{ steps.version.outputs.mpk }}" \
            --version "${{ steps.version.outputs.version }}"
